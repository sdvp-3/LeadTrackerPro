<!doctype html>
<html>
  <head>
      <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Tracker Pro</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <header>
        <section>
          <input type="text" placeholder="Search" />
          <button>about</button>
          <button>contact</button>
          <button>Github</button>
          <button>Dashboard</button>
        </section>
      </header>

      <div class="middle">
        <div  class="title1"> <p class="titles1">Enter Your Leads</p></div>
       
        <section class="input-section">
          <p>Please enter your Name !</p>

          <input
            class="add-name"
            type="text"
            placeholder="Enter your Name"
            id="add-input"
          />

          <p>Please enter your Status !</p>
          <input
            class="add-job"
            type="text"
            placeholder="Enter your Status"
            id="add-status"
          />

          <p>Please enter your Email !</p>
          <input
            class="add-gmail"
            type="email"
            placeholder="Enter your Email"
            id="add-email"
          />

          <p>Please enter your Comment !</p>
          <input
            class="add-comment"
            type="text"
            placeholder="Enter your Comment !"
            id="add-opinion-input"
          />

          <p>Please enter your Date !</p>

          <input class="add-birth" type="date" id="add-date" />

          <button class="save-btn" id="save-btn-input">Save</button>
        </section>

     <div  class="title2">   <p class="titles2">Saved Leads</p></div>
        <section class="saved-section">
          <div id="leadCard">
           
          </div>
        </section>

   <div class="title3">     <p class="titles3">Favorite Leads</p></div>
        <section class="fav-section">
          <div id="leadCard2"></div>
        </section>
      </div>

      <below> </below>
    </main>

    <script src="index.js"></script>
  </body>
</html>
